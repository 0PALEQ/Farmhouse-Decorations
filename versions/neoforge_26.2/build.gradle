plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

apply from: '../../gradle/common.gradle'

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('build/generated/resources').absolutePath,
                    '--existing', file('../../shared/versions/26.2/src/main/resources').absolutePath
        }
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
