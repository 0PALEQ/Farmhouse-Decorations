plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.3'
}

apply from: '../../gradle/common.gradle'

// The item definitions, recipes, and loot tables remain compatible with 26.3.
sourceSets.main.resources.srcDir '../../shared/versions/26.2/src/main/resources'

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
